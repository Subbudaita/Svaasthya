[project]
name = "swasthya-api"
version = "0.0.0"
description = "Swasthya HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "swasthya-shared",
    "fastapi>=0.143,<0.144",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.5,<0.6",
    "pyjwt[crypto]>=2.15,<3",
    "swasthya-engines",
    "swasthya-ingestion",
    "python-multipart>=0.0.32,<0.1",
    "python-telegram-bot>=22.8,<23",
]

[tool.uv.sources]
swasthya-shared = { workspace = true }
swasthya-engines = { workspace = true }
swasthya-ingestion = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swasthya_api"]
