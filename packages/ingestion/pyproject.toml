[project]
name = "swasthya-ingestion"
version = "0.0.0"
description = "Perception of meals (photo, text) for Swasthya — the only package that calls a vision model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "swasthya-shared",
    "swasthya-engines",
    "anthropic>=1.15,<2",
    "pillow>=13,<14",
    "pydantic>=2.14,<3",
]

[tool.uv.sources]
swasthya-shared = { workspace = true }
swasthya-engines = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swasthya_ingestion"]
