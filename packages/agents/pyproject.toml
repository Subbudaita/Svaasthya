[project]
name = "swasthya-agents"
version = "0.0.0"
description = "LangGraph supervisor and specialists for Swasthya (Phase 3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "swasthya-shared",
    "swasthya-engines",
    "anthropic>=1.15,<2",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2,<3.3",
    "pydantic>=2.14,<3",
]

[tool.uv.sources]
swasthya-shared = { workspace = true }
swasthya-engines = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swasthya_agents"]
