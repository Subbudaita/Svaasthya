# Meal slots by local time of day, used by "same as yesterday" to pick which
# meal to repeat. Half-open [start, end); "dinner" wraps past midnight.
version: "2026-10-18"
slots:
  - {name: breakfast, start: "04:00", end: "11:00"}
  - {name: lunch, start: "11:00", end: "16:00"}
  - {name: snack, start: "16:00", end: "19:00"}
  - {name: dinner, start: "19:00", end: "04:00"}
